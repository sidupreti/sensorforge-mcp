[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sensorforge-mcp"
dynamic = ["version"]
description = "MCP server for the SensorForge Optimizer: shrink trained models to fit edge devices, from your coding agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "EdgeForge LLC" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "tinyml", "edge-ai", "tflite", "tensorflow-lite-micro", "onnx", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://sensorforge.dev/optimize"
Repository = "https://github.com/sidupreti/sensorforge-mcp"
Changelog = "https://github.com/sidupreti/sensorforge-mcp/blob/main/CHANGELOG.md"

[project.scripts]
sensorforge-mcp = "sensorforge_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "uvicorn>=0.30", "starlette>=0.37", "python-multipart>=0.0.9"]

[tool.hatch.version]
path = "src/sensorforge_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorforge_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/sensorforge_mcp", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "server.json", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs against a local copy of the service (SENSORFORGE_E2E_URL)"]
addopts = "-m 'not live'"
